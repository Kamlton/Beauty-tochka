services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beautytochka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./BeautyTochka.API
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=beautytochka;Username=postgres;Password=postgres
      - Jwt__Secret=YourSuperSecretKey123!@#BeautyTochka2026
      - Jwt__Issuer=BeautyTochka
      - Jwt__Audience=BeautyTochkaClient
      - Jwt__ExpiryMinutes=120
    depends_on:
      - postgres

volumes:
  pgdata:
